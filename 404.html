<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirección Cobranza</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-border: #e4e0d4;
    --text: #1c211f;
    --text-muted: #61675f;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --danger: #a4432f;
    --danger-soft: #f6e9e4;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181a;
      --surface: #1c2224;
      --surface-border: #2c3436;
      --text: #eaece9;
      --text-muted: #97a19b;
      --accent: #59b79a;
      --accent-ink: #0d1513;
      --danger: #e08468;
      --danger-soft: #2c211d;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14181a;
    --surface: #1c2224;
    --surface-border: #2c3436;
    --text: #eaece9;
    --text-muted: #97a19b;
    --accent: #59b79a;
    --accent-ink: #0d1513;
    --danger: #e08468;
    --danger-soft: #2c211d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    padding: 36px 28px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 4px solid var(--surface-border);
    border-top-color: var(--accent);
    animation: girar 0.9s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
    line-height: 1.35;
  }

  .subtext {
    font-size: 14px;
    color: var(--text-muted);
    margin: -8px 0 0;
    line-height: 1.5;
  }

  .fallback {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .fallback-label {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 9px;
    border: 1px solid var(--accent);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    background: transparent;
    color: var(--accent);
    transition: filter 0.15s ease;
  }

  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { flex: none; }

  .error {
    padding: 14px 16px;
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    border-radius: 10px;
    color: var(--danger);
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="heading">Espera mientras te redirigimos a WhatsApp…</h1>
  <div class="subtext" id="subtext">Esto solo toma un segundo.</div>

  <div class="fallback" id="fallback">
    <div class="fallback-label">¿No se abrió solo?</div>
    <a class="btn" id="openBtn" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2h.01c5.46 0 9.9-4.45 9.9-9.91S17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.13.11-1.82-.11a16.7 16.7 0 0 1-1.65-.61c-2.9-1.25-4.79-4.17-4.94-4.36-.15-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.15.11.32.02.51-.09.2-.14.32-.27.49-.14.17-.29.38-.41.51-.14.14-.28.29-.12.57.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.25 2.24 1.39.28.14.44.12.6-.07.17-.2.71-.83.9-1.11.19-.28.38-.24.63-.14.26.09 1.65.78 1.93.92.28.14.47.21.54.33.07.13.07.72-.17 1.4z"/>
      </svg>
      Abrir WhatsApp
    </a>
  </div>
</div>

<script>
  (function () {
    // Twilio a veces pega el valor de la variable del botón directo después de
    // la carpeta, SIN el "?" (queda como parte de la ruta, no del query string).
    // El navegador conserva la URL original pedida — por eso buscamos "n=" o
    // "d=" en toda la URL (pathname incluido), no solo en location.search.
    // Cloudflare además normaliza esa ruta y convierte "=" en "%3D" y "&" en
    // "%26" antes de hacer su propio redirect interno a la version 200 --
    // deshacemos SOLO esos dos, sin tocar el resto del encoding (el del
    // mensaje en sí, que URLSearchParams necesita decodificar una sola vez).
    var params = new URLSearchParams(window.location.search);
    if (!params.get('n') && !params.get('d')) {
      var urlCompleta = (window.location.pathname + window.location.search + window.location.hash)
        .replace(/%3D/gi, '=')
        .replace(/%26/gi, '&');
      var idx = urlCompleta.indexOf('n=');
      if (idx === -1) idx = urlCompleta.indexOf('d=');
      if (idx !== -1) {
        params = new URLSearchParams(urlCompleta.slice(idx));
      }
    }

    // Contrato nuevo: ?n=Numero&m=Mensaje (el mensaje ya viene armado, tal cual se manda)
    var nParam = params.get('n');
    var mParam = params.get('m');

    var numero, mensaje;

    if (nParam && mParam) {
      numero = nParam;
      mensaje = mParam;
    } else {
      // Compatibilidad con el contrato anterior: ?d=Nombre|Folio|Numero
      var raw = params.get('d') || '';
      var parts = raw.split('|');
      var nombre = (parts[0] || '').trim();
      var folio = (parts[1] || '').trim();
      numero = (parts[2] || '').trim();
      if (nombre && folio) {
        mensaje = 'Hola, soy ' + nombre + '. Hablo para conocer mi situación de cobro con el folio ' + folio + '.';
      }
    }

    var heading = document.getElementById('heading');
    var subtext = document.getElementById('subtext');
    var spinner = document.getElementById('spinner');
    var fallback = document.getElementById('fallback');

    if (!mensaje || !numero) {
      spinner.hidden = true;
      fallback.hidden = true;
      heading.textContent = 'No pudimos abrir tu chat';
      subtext.textContent = '';
      var err = document.createElement('div');
      err.className = 'error';
      err.textContent = 'Por favor cierra esta ventana e inténtalo de nuevo desde el mensaje de WhatsApp. Si el problema sigue, contáctanos directamente.';
      document.getElementById('card').appendChild(err);
      return;
    }

    var numeroLimpio = numero.replace(/[^0-9]/g, '');
    var link = 'https://wa.me/' + numeroLimpio + '?text=' + encodeURIComponent(mensaje);

    var btn = document.getElementById('openBtn');
    btn.href = link;

    // El intento automático va con un pequeño respiro para que el navegador
    // termine de pintar la tarjeta antes de navegar -- algunos navegadores
    // internos (como el de WhatsApp en iPhone) se quedan en blanco si la
    // navegación ocurre antes de terminar el render.
    setTimeout(function () {
      window.location.href = link;
    }, 60);

  })();
</script>
</body>
</html>
